<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore the full MIR CARS Los Angeles rental fleet with vehicle carousels, daily rates, specs, and booking links."
    />
    <title>Full Fleet | MIR CARS</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
    <script type="module" src="fleet.js"></script>
  </head>
  <body id="top">
    <header class="site-header">
      <a class="brand" href="index.html#top" aria-label="MIR CARS home">
        <span>
          <strong class="mir-lockup brand-name" aria-label="MIR CARS">
            <span class="mir-lockup-top">MIR</span>
            <span class="mir-lockup-bottom">CARS</span>
          </strong>
          <small>LA Rentals</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="#fleet">Fleet</a>
        <a href="policies/">Policies</a>
        <a href="contact/">Contact</a>
      </nav>

      <div class="header-actions"><a class="header-cta header-trip-cta" href="portal/">My trip</a><a class="header-cta" href="booking.html">Book now</a></div>
    </header>

    <main class="fleet-page-main">
      <section class="section fleet-page-hero" id="fleet">
        <p class="eyebrow">COMPLETE FLEET</p>
        <h1>Browse rentals</h1>
        <p>
          Review the full Los Angeles fleet with vehicle photos, daily rates, key specs, and booking request links.
        </p>
      </section>

      <section class="fleet-page-controls" aria-label="Fleet filters and sorting">
        <div class="fleet-tools">
          <div class="fleet-controls" id="fleetFilters" aria-label="Vehicle types"></div>
          <form class="fleet-date-filter" id="fleetDateFilter" aria-describedby="fleetAvailabilitySummary fleetDateMessage">
            <label class="date-filter-field date-filter-combo">
              <span>Start</span>
              <span class="date-picker-shell" data-date-picker>
                <input type="hidden" name="startDate" data-date-input data-date-default-min="today" />
                <button class="date-picker-trigger" type="button" data-date-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="Choose start date">
                  <span data-date-display>Start date</span>
                </button>
              </span>
              <span class="time-select-shell" data-time-select>
                <input type="hidden" name="startTime" data-time-input />
                <button class="time-select-trigger" type="button" data-time-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="Choose start time">
                  <span data-time-display>Start time</span>
                </button>
              </span>
            </label>
            <label class="date-filter-field date-filter-combo">
              <span>End</span>
              <span class="date-picker-shell" data-date-picker>
                <input type="hidden" name="endDate" data-date-input data-date-default-min="today" />
                <button class="date-picker-trigger" type="button" data-date-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="Choose end date">
                  <span data-date-display>End date</span>
                </button>
              </span>
              <span class="time-select-shell" data-time-select>
                <input type="hidden" name="endTime" data-time-input />
                <button class="time-select-trigger" type="button" data-time-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="Choose end time">
                  <span data-time-display>End time</span>
                </button>
              </span>
            </label>
            <button class="button primary" type="submit" disabled>Show Available</button>
            <button class="button secondary" type="button" data-clear-dates hidden>Clear</button>
            <span class="date-search-message" id="fleetDateMessage" aria-live="polite"></span>
          </form>
          <label class="sort-control">
            Sort
            <select id="fleetSort" aria-label="Sort fleet">
              <option value="az">A-Z</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <p class="fleet-availability-summary" id="fleetAvailabilitySummary" aria-live="polite" hidden></p>
      </section>

      <section class="fleet-grid fleet-grid-full" id="fleetGrid" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <div class="footer-brand">
        <span class="mir-lockup mir-lockup-inline" aria-label="MIR CARS"><span class="mir-lockup-top">MIR</span><span class="mir-lockup-bottom">CARS</span></span>
        <span>Los Angeles, California</span>
      </div>
      <span class="footer-copyright">&copy; 2026 MIR CARS. All rights reserved.</span>
    </footer>
  </body>
</html>
