<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MIR CARS">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17191b" />
      <stop offset="0.55" stop-color="#0d0e0f" />
      <stop offset="1" stop-color="#1f2428" />
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.2" stop-color="#f5f9fc" />
      <stop offset="0.46" stop-color="#aebdca" />
      <stop offset="0.68" stop-color="#ffffff" />
      <stop offset="1" stop-color="#cdd9e2" />
    </linearGradient>
    <filter id="shine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e8f0f7" flood-opacity="0.22" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="84" fill="url(#bg)" />
  <rect x="22" y="22" width="468" height="468" rx="68" fill="none" stroke="#dce6ef" stroke-opacity="0.18" stroke-width="10" />
  <g filter="url(#shine)" font-family="Georgia, 'Times New Roman', serif" font-weight="800" fill="url(#metal)" stroke="#e8f0f7" stroke-opacity="0.48">
    <text x="256" y="218" text-anchor="middle" font-size="166" stroke-width="2">MIR</text>
    <text x="284" y="334" text-anchor="middle" font-size="134" font-style="italic" stroke-width="1.8">CARS</text>
  </g>
  <text x="256" y="398" text-anchor="middle" fill="#aeb8c2" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5">LA</text>
</svg>
