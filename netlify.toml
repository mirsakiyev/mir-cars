[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/admin/login"
  to = "/admin/login/"
  status = 301

[[redirects]]
  from = "/admin/bookings"
  to = "/admin/bookings/"
  status = 301

[[redirects]]
  from = "/admin/vehicles"
  to = "/admin/vehicles/"
  status = 301

[[redirects]]
  from = "/admin/contacts"
  to = "/admin/contacts/"
  status = 301

[[redirects]]
  from = "/admin/payments"
  to = "/admin/payments/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/faq/"
  status = 301

[[redirects]]
  from = "/lost-and-found"
  to = "/lost-and-found/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/payment-success"
  to = "/payment-success.html"
  status = 200

[[redirects]]
  from = "/payment-cancelled"
  to = "/payment-cancelled.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
