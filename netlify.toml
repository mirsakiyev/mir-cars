[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/admin/login"
  to = "/admin/login/"
  status = 301

[[redirects]]
  from = "/admin/bookings"
  to = "/admin/bookings/"
  status = 301

[[redirects]]
  from = "/admin/vehicles"
  to = "/admin/vehicles/"
  status = 301

[[redirects]]
  from = "/admin/contacts"
  to = "/admin/contacts/"
  status = 301

[[redirects]]
  from = "/admin/payments"
  to = "/admin/payments/"
  status = 301

[[redirects]]
  from = "/payment-success"
  to = "/payment-success.html"
  status = 200

[[redirects]]
  from = "/payment-cancelled"
  to = "/payment-cancelled.html"
  status = 200
